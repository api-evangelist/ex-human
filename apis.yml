aid: ex-human
name: Ex-Human
description: Ex-Human is a "Digital Human as a Service" platform that provides a single, unified API for
  building fully immersive, emotionally intelligent AI companions that communicate through text, voice,
  images, and video. Backed by a16z, the company lets developers design unique character personalities
  and generate multimodal responses at production scale. The Ex-Human API spans a multimodal chatbot (roleplay
  and realistic-chat models with long-term memory and smart replies), image generation (personalized gallery
  images and avatars via the persona-2 and supreme models), talking-head avatar animation (lip-sync from
  text or audio), image-to-video animation jobs, and text-to-speech. It is trusted by large consumer-technology
  companies to power AI companions, entertainment and gaming NPCs, dating experiences, AI twins, education
  tutors, and healthcare and therapy support at scale.
